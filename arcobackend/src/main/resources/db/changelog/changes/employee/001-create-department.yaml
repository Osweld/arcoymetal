databaseChangeLog:
  - changeSet:
      id: 001-create-department
      author: arcobackend
      changes:
        - createTable:
            tableName: department
            columns:
              - column:
                  name: id
                  type: varchar(10)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true