
databaseChangeLog:
  - changeSet:
      id: 001-create-employee
      author: arcobackend
      changes:
        - createTable:
            tableName: employee
            columns:
              # Primary key
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employee
                    nullable: false

              # Personal information
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_employee_email

              - column:
                  name: phone_number
                  type: VARCHAR(8)
                  constraints:
                    nullable: false

              - column:
                  name: gender
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: birth_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: address_line
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: district_id
                  type: varchar(10)
                  constraints:
                    nullable: false

              # Identification information
              - column:
                  name: dui
                  type: VARCHAR(9)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_employee_dui

              - column:
                  name: nit
                  type: VARCHAR(17)

              - column:
                  name: isss
                  type: VARCHAR(9)

              - column:
                  name: nup
                  type: VARCHAR(9)

              # Pension information
              - column:
                  name: pension_fund_institution
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              # Auditing information
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

        # Unique constraints
        - addUniqueConstraint:
            tableName: employee
            columnNames: nit
            constraintName: uk_employee_nit

        - addUniqueConstraint:
            tableName: employee
            columnNames: isss
            constraintName: uk_employee_isss

        - addUniqueConstraint:
            tableName: employee
            columnNames: nup
            constraintName: uk_employee_nup

        # Foreign keys
        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: district_id
            constraintName: fk_employee_district
            referencedTableName: district
            referencedColumnNames: id
            onDelete: RESTRICT
