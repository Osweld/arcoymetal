databaseChangeLog:
  - changeSet:
      id: 002-create-employment-period
      author: arcobackend
      changes:
        - createTable:
            tableName: employment_period
            columns:
              - column:
                  name: employment_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employment_period
                    nullable: false

              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: DATE

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: termination_reason
                  type: VARCHAR(50)

              # Audit fields
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

        # Foreign key
        - addForeignKeyConstraint:
            baseTableName: employment_period
            baseColumnNames: employee_id
            constraintName: fk_employment_period_employee
            referencedTableName: employee
            referencedColumnNames: id
            onDelete: RESTRICT

        # Indexes
        - createIndex:
            tableName: employment_period
            indexName: idx_employment_employee
            columns:
              - column:
                  name: employee_id

        # Check constraints
        - sql:
            sql: |
              ALTER TABLE employment_period
              ADD CONSTRAINT chk_employment_dates
              CHECK (end_date IS NULL OR end_date >= start_date);

        - sql:
            sql: |
              ALTER TABLE employment_period
              ADD CONSTRAINT chk_employment_status
              CHECK (
                (status = 'ACTIVE'
                  AND end_date IS NULL
                  AND termination_reason IS NULL)
                OR
                (status = 'TERMINATED'
                  AND end_date IS NOT NULL
                  AND termination_reason IS NOT NULL)
              );

        # Only one active employment period per employee
        - sql:
            sql: |
              CREATE UNIQUE INDEX uk_employment_active_employee
              ON employment_period (employee_id)
              WHERE status = 'ACTIVE';
