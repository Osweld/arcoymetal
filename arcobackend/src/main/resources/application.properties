spring.application.name=arcobackend

spring.docker.compose.file=compose.yml
spring.docker.compose.lifecycle-management= start-only

spring.jpa.hibernate.ddl-auto= validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yml

spring.modulith.events.jdbc.schema-initialization.enabled=true

arco.security.jwt.secret=${ARCO_JWT_SECRET:arco-metal-dev-secret-change-me-in-production-min-32-bytes-key!!}
arco.security.jwt.access-token-expiration-seconds=${ARCO_JWT_ACCESS_TTL:900}
arco.security.jwt.refresh-token-expiration-seconds=${ARCO_JWT_REFRESH_TTL:604800}
arco.security.cookie.refresh-token-name=arco_refresh_token
arco.security.cookie.secure=${ARCO_COOKIE_SECURE:false}
arco.security.cookie.same-site=${ARCO_COOKIE_SAMESITE:Lax}
arco.security.cors.allowed-origins=${ARCO_CORS_ALLOWED_ORIGINS:http://localhost:4200}
arco.security.login.max-failed-attempts=${ARCO_LOGIN_MAX_FAILED_ATTEMPTS:5}
